services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: princeps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d  # only schema + seed, in order

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/princeps
      NEO4J_PLUGINS: '[]'
    ports:
      - "7687:7687"   # Bolt
      - "7474:7474"   # Browser
    volumes:
      - neo4jdata:/data

  backend:
    build: .
    depends_on:
      - postgis
      - neo4j
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/princeps
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: princeps
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  neo4jdata:
