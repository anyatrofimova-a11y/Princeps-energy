services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: princeps
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d princeps"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/princeps
      NEO4J_PLUGINS: '[]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      postgis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/princeps
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      SAM_PYTHON: ${SAM_PYTHON:-.venv-sam/bin/python}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: princeps
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./utils:/app/utils
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ""
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    depends_on:
      - backend
    environment:
      BACKEND_HOST: backend
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  neo4jdata:
