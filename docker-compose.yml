services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: feasibly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d  # only schema + seed, in order

  backend:
    build: .
    depends_on:
      - postgis
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgis:5432/feasibly
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
