# nginx config for Princeps frontend
# Serves static Vite build and proxies API requests to the public backend URL.

server {
    listen 80;
    server_name _;

    resolver 1.1.1.1 8.8.8.8 valid=60s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass https://princeps-api.fly.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host princeps-api.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /chat/ {
        proxy_pass https://princeps-api.fly.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host princeps-api.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass https://princeps-api.fly.dev;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host princeps-api.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    location ~ ^/(site|sites|tiles|opt|docs|grid|grid-efficiency|nom|planning|inventory|analytics|tenders|health|electricity|job|jobs|geeflow|procurement|legacy|geoai|bess|bipv|classify|prospector|scoring|nged|eso|repd|workflows|energy_system|tracker|rag|notifications|hardware|teaser|alerts|vision|retrofit|portfolios)(/|$) {
        proxy_pass https://princeps-api.fly.dev;
        proxy_ssl_server_name on;
        proxy_set_header Host princeps-api.fly.dev;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
